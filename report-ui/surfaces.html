<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coddiwomple — Surfaces</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #14171c; --panel2: #1a1e25; --line: #262c35;
    --text: #e7ebf0; --dim: #8d97a5; --faint: #5b6472;
    --good: #4ade80; --warn: #fbbf24; --bad: #f87171; --accent: #60a5fa;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header.top {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { font-weight: 600; letter-spacing: -0.2px; }
  nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  nav button {
    background: transparent; border: 1px solid transparent; color: var(--dim);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  nav button:hover { color: var(--text); }
  nav button[aria-selected="true"] { background: var(--panel2); border-color: var(--line); color: var(--text); }
  main { padding: 20px; max-width: 1280px; margin: 0 auto; }
  .q { color: var(--dim); font-size: 13px; margin: 0 0 16px; }

  .banner {
    padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px;
    border: 1px solid var(--line); background: var(--panel);
  }
  .banner.warn { border-color: #4a3a12; background: #1f1a0c; color: #f5d491; }
  .banner.bad  { border-color: #4a1f1f; background: #1f0f0f; color: #fca5a5; }

  .wk { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
    border-radius: 999px; font-size: 11px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--dim); white-space: nowrap;
  }
  .chip.good { color: var(--good); border-color: #1e3a28; }
  .chip.warn { color: var(--warn); border-color: #4a3a12; }
  .chip.bad  { color: var(--bad);  border-color: #4a1f1f; }
  .chip.drop { color: var(--accent); border-color: #1e3050; }

  .grid { display: grid; gap: 12px; }
  .g5 { grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); }
  /* Six leadership cards at auto-fit gave five across and orphaned MER alone on
     a second row. Three columns splits them evenly into two rows. */
  .gl { grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); }
  @media (min-width: 1080px) { .gl { grid-template-columns: repeat(3, 1fr); } }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); font-weight: 600; }

  .kpi .label { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  .kpi .val { font-family: var(--mono); font-size: 22px; font-weight: 600; letter-spacing: -0.5px; white-space: nowrap; }
  .kpi .val.blank { color: var(--faint); font-size: 18px; font-weight: 400; }
  .kpi .meta { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .kpi .note { margin-top: 8px; font-size: 11.5px; color: var(--faint); line-height: 1.45; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  td.n, th.n { text-align: right; font-family: var(--mono); }
  tr:last-child td { border-bottom: none; }

  .rung { display: flex; align-items: baseline; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .rung:last-child { border-bottom: none; }
  .rung .name { color: var(--dim); font-size: 13px; }
  .rung .v { font-family: var(--mono); font-size: 15px; }

  svg.chart { width: 100%; height: auto; max-height: 300px; display: block; overflow: visible; }
  svg.chart text { font-size: 13px; fill: #5b6472; }
  svg.chart line.grid { stroke: #262c35; stroke-width: 1; }
  svg.chart line.peer { stroke: #4a5262; stroke-width: 2; }
  svg.chart line.cur  { stroke: #60a5fa; stroke-width: 3.5; }
  svg.chart line.now  { stroke: #60a5fa; stroke-width: 1; stroke-dasharray: 3 3; opacity: .5; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 11px; color: var(--dim); }
  .legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; }
  .toggle { display: flex; gap: 4px; }
  .toggle button {
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    padding: 3px 9px; border-radius: 5px; font-size: 11px; cursor: pointer;
  }
  .toggle button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); }
  .stage { padding: 6px 0; }
  .stage .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .stage .bar { height: 5px; background: var(--panel2); border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .stage .bar > span { display: block; height: 100%; background: var(--accent); opacity: .65; }
  .verdict { font-size: 13px; line-height: 1.55; }
  .lede {
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    background: var(--panel); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px;
  }
  .lede h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; line-height: 1.35; }
  .lede p { margin: 0 0 6px; font-size: 13px; color: var(--dim); line-height: 1.55; }
  .lede p:last-child { margin-bottom: 0; }
  .lede.good { border-left-color: var(--good); }
  .lede.warn { border-left-color: var(--warn); }
  .lede.bad  { border-left-color: var(--bad); }
  .untrusted { opacity: .45; text-decoration: line-through; }
  .sub { color: var(--faint); font-size: 11.5px; line-height: 1.5; }

  .empty { color: var(--faint); font-size: 13px; padding: 8px 0; }
  a.link { color: var(--accent); text-decoration: none; }
  a.link:hover { text-decoration: underline; }
  .foot { color: var(--faint); font-size: 11.5px; margin-top: 24px; line-height: 1.6; }
</style>
</head>
<body>
<header class="top">
  <span class="brand">Coddiwomple</span>
  <span id="ctx" class="chip"></span>
  <nav>
    <button data-s="daily" aria-selected="true">Daily ops</button>
    <button data-s="weekly" aria-selected="false">Weekly review</button>
    <button data-s="admin" aria-selected="false">Admin</button>
    <a href="/growth" style="margin-left:8px;color:var(--accent);font-size:13px;align-self:center">Growth OS →</a>
  </nav>
</header>
<main id="main"><div class="empty">Loading…</div></main>

<script>
(function () {
  const API = "/api";
  const $ = (id) => document.getElementById(id);
  const main = $("main");
  let surface = "daily";
  let decayMode = "share";
  let lastWeekly = null;

  const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const isBlank = (v) => v === "" || v === null || v === undefined;

  const money = (v) => isBlank(v) ? null : Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 });
  // Everything monetary here is EGP. Stated on the headline figures rather than
  // repeated in every table cell.
  const moneyE  = (v) => isBlank(v) ? null : money(v) + " EGP";
  const money2E = (v) => isBlank(v) ? null : Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " EGP";
  const num0  = (v) => isBlank(v) ? null : Number(v).toLocaleString();
  const pct   = (v) => isBlank(v) ? null : (Number(v) * 100).toFixed(1) + "%";
  const money2= (v) => isBlank(v) ? null : Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  async function get(path, query) {
    const url = new URL(API + path, location.origin);
    for (const [k, v] of Object.entries(query || {})) if (v) url.searchParams.set(k, v);
    const r = await fetch(url, { headers: { Accept: "application/json" }, credentials: "include" });
    if (!r.ok) throw new Error("HTTP " + r.status + " on " + path);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Request failed");
    return j;
  }

  // A metric never renders as a bare number. Basis and settledness ride with it,
  // and a missing value shows as "no data" rather than a zero.
  function kpi(label, m, fmt) {
    const val = m && !isBlank(m.value) ? fmt(m.value) : null;
    const chips = [];
    if (m && m.basis) {
      const cls = m.basis === "measured" ? "good" : (m.basis === "unavailable" ? "bad" : "warn");
      chips.push(`<span class="chip ${cls}">${esc(m.basis.replace(/_/g, " "))}</span>`);
    }
    if (m && m.settled === false) chips.push(`<span class="chip warn">provisional</span>`);
    if (m && m.settled === true) chips.push(`<span class="chip good">settled</span>`);
    return `<div class="card kpi">
      <div class="label">${esc(label)}</div>
      <div class="val ${val === null ? "blank" : ""}">${val === null ? "no data" : esc(val)}</div>
      <div class="meta">${chips.join("")}</div>
      ${m && m.note ? `<div class="note">${esc(m.note)}</div>` : ""}
    </div>`;
  }

  function kpiInline(label, m, fmt) {
    const v = m && !isBlank(m.value) ? fmt(m.value) : null;
    const chips = [];
    if (m && m.basis) chips.push(`<span class="chip ${m.basis === "measured" ? "good" : "warn"}">${esc(m.basis.replace(/_/g," "))}</span>`);
    if (m && m.settled === false) chips.push(`<span class="chip warn">provisional</span>`);
    return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <span style="color:var(--dim);font-size:13px">${esc(label)}</span>
        <span style="font-family:var(--mono);font-size:15px">${v === null ? "—" : esc(v)}</span>
      </div>
      <div class="meta">${chips.join("")}</div>
      ${m && m.note ? `<div class="note">${esc(m.note)}</div>` : ""}
    </div>`;
  }

  function rung(name, v, fmt) {
    return `<div class="rung"><span class="name">${esc(name)}</span><span class="v">${isBlank(v) ? "—" : esc(fmt(v))}</span></div>`;
  }

  // ---- Charts, hand-drawn SVG ---------------------------------------------
  // No chart library: that would be a dependency, and the two charts that change
  // a decision here are a multi-series line and a step-down funnel.

  function decayChart(cmp) {
    const key = decayMode === "share" ? "share_of_w0" : "orders";
    const series = (cmp.cohorts || []).map((c) => ({
      id: c.drop_id,
      current: c.is_current,
      pts: (c.points || []).filter((p) => !isBlank(p[key]))
        .map((p) => ({ x: Number(p.i), y: Number(p[key]), complete: p.complete }))
    })).filter((s) => s.pts.length > 1);

    if (!series.length) return `<div class="empty">Not enough drop history to plot a decay curve.</div>`;

    const W = 1400, H = 340, L = 62, R = 20, T = 16, B = 38;
    const xs = series.flatMap((s) => s.pts.map((p) => p.x));
    const ys = series.flatMap((s) => s.pts.map((p) => p.y));
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const yMax = (Math.max(...ys) * 1.08) || 1;
    const px = (x) => L + (x1 === x0 ? 0 : (x - x0) / (x1 - x0)) * (W - L - R);
    const py = (y) => T + (1 - y / yMax) * (H - T - B);
    const fy = decayMode === "share" ? (v) => (v * 100).toFixed(0) + "%" : (v) => String(Math.round(v));

    let g = "";
    for (let i = 0; i <= 4; i++) {
      const v = (yMax / 4) * i, y = py(v);
      g += `<line class="grid" x1="${L}" y1="${y}" x2="${W - R}" y2="${y}"/>`
         + `<text x="${L - 10}" y="${y + 4}" text-anchor="end">${esc(fy(v))}</text>`;
    }
    for (let x = x0; x <= x1; x++) {
      g += `<text x="${px(x)}" y="${H - 10}" text-anchor="middle">W${x === 0 ? "0" : "+" + x}</text>`;
    }

    const now = Number(cmp.drop_week_index);
    if (Number.isFinite(now) && now >= x0 && now <= x1) {
      g += `<line class="now" x1="${px(now)}" y1="${T}" x2="${px(now)}" y2="${H - B}"/>`;
    }

    // An open window holds fewer days and reads as a collapse that did not
    // happen, so its segment is dashed and its marker hollow.
    for (const s of series) {
      const cls = s.current ? "cur" : "peer";
      for (let i = 1; i < s.pts.length; i++) {
        const a = s.pts[i - 1], b = s.pts[i];
        const dash = (!a.complete || !b.complete) ? ` stroke-dasharray="4 3"` : "";
        g += `<line class="${cls}" x1="${px(a.x)}" y1="${py(a.y)}" x2="${px(b.x)}" y2="${py(b.y)}"${dash}/>`;
      }
      if (s.current) {
        for (const p of s.pts) {
          g += `<circle cx="${px(p.x)}" cy="${py(p.y)}" r="5" fill="${p.complete ? "#60a5fa" : "#0d0f12"}" stroke="#60a5fa" stroke-width="1.5"/>`;
        }
      }
    }

    const legend = series.map((s) =>
      `<span><i style="background:${s.current ? "#60a5fa" : "#4a5262"}"></i>${esc(s.id)}${s.current ? " · this drop" : ""}</span>`
    ).join("") + `<span><i style="background:#4a5262"></i>dashed = window still open</span>`;

    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="Orders by week since drop, one line per drop">${g}</svg><div class="legend">${legend}</div>`;
  }

  // Step-down funnel. The paid path and the site path are drawn SEPARATELY and
  // never joined: GA4 sessions are not a subset of Meta landing-page views —
  // organic traffic is in there too — so one funnel through both would show a
  // drop-off that does not exist.
  function funnel(title, stages, note) {
    const rows = stages.filter((s) => !isBlank(s.v));
    if (rows.length < 2) return "";
    const top = Number(rows[0].v) || 1;
    return `<div style="margin-bottom:16px">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin-bottom:4px">${esc(title)}</div>
      ${rows.map((s, i) => {
        const v = Number(s.v);
        const prev = i === 0 ? null : Number(rows[i - 1].v);
        const ofPrev = (prev && prev > 0) ? v / prev : null;
        // No bar: on a funnel spanning two orders of magnitude a linear bar is
        // all-or-nothing, and the step-down percentage is the actual signal.
        return `<div class="stage" style="border-bottom:1px solid var(--line)"><div class="row">
            <span style="color:var(--dim);font-size:13px">${esc(s.n)}</span>
            <span style="font-family:var(--mono);font-size:13px">${esc(num0(v))}${ofPrev === null ? "" : ` <span style="color:var(--faint)">· ${esc((ofPrev * 100).toFixed(1))}% of above</span>`}</span>
          </div>
        </div>`;
      }).join("")}
      ${note ? `<div class="sub" style="margin-top:6px">${esc(note)}</div>` : ""}
    </div>`;
  }

  // The waterfall. Rows that could not be measured are SHOWN, greyed, with the
  // reason — dropping them would make an incomplete total look complete.
  function contributionCard(c) {
    if (!c || !(c.steps || []).length) return "";
    const row = (st) => {
      const isSub = st.basis === "subtotal";
      const isStart = st.key === "net_sales";
      return `<div style="display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);${isSub ? "background:rgba(96,165,250,.05)" : ""}">
        <span style="flex:1;font-size:13px;${isSub || isStart ? "font-weight:600" : "color:var(--dim)"}">${esc(st.label)}
          ${st.basis && !isSub ? `<span class="chip ${st.basis === "measured" || st.basis === "founder_rate_card" ? "good" : st.included ? "warn" : "bad"}" style="margin-left:6px">${esc(String(st.basis).replace(/_/g, " "))}</span>` : ""}
        </span>
        <span style="font-family:var(--mono);font-size:14px;text-align:right;min-width:110px;${!st.included && !isSub ? "color:var(--faint)" : ""}">
          ${st.included ? esc(money(st.amount) ?? "") : (isSub ? "" : "not measured")}
        </span>
        <span style="font-family:var(--mono);font-size:14px;text-align:right;min-width:110px;color:${isSub || isStart ? "var(--text)" : "var(--faint)"}">
          ${isBlank(st.running) ? "" : esc(money(st.running))}
        </span>
      </div>
      ${st.note || st.missing_reason ? `<div class="sub" style="padding-bottom:6px">${esc(st.note || st.missing_reason)}</div>` : ""}`;
    };

    return `<div class="card" style="margin-top:12px">
      <h3>What is actually left (EGP)</h3>
      ${c.steps.map(row).join("")}
      <div style="display:flex;align-items:baseline;gap:10px;padding:12px 0 4px">
        <span style="flex:1;font-size:15px;font-weight:600">${c.is_upper_bound ? "At most" : "Contribution"}</span>
        <span style="font-family:var(--mono);font-size:22px;font-weight:600">${esc(moneyE(c.bottom_line) ?? "—")}</span>
        <span style="font-family:var(--mono);font-size:14px;color:var(--dim);min-width:70px;text-align:right">${esc(pct(c.bottom_line_rate) ?? "")}</span>
      </div>
      ${c.is_upper_bound ? `<div class="banner warn" style="margin:10px 0 0">${esc(c.bound_note)}
        <ul style="margin:6px 0 0;padding-left:18px">${(c.excluded || []).map((e) => `<li style="margin-bottom:3px"><strong>${esc(e.term)}</strong> — ${esc(e.reason)}</li>`).join("")}</ul></div>` : ""}
    </div>`;
  }

  const VERDICT = {
    steeper_than_any_prior_drop: ["bad", "Decaying faster than any prior drop at this point. This is not ordinary post-drop decay — it needs a decision."],
    shallower_than_any_prior_drop: ["good", "Holding better than any prior drop at this point."],
    within_prior_range: ["good", "Ordinary post-drop decay. Nothing here needs a decision."]
  };

  function dropComparisonCard(cmp) {
    if (!cmp || !cmp.available) {
      return `<div class="card"><h3>Drop-relative comparison</h3>
        <div class="empty">${esc((cmp && cmp.reason) || "Unavailable.")}</div></div>`;
    }
    const p = cmp.peer || {};
    const v = VERDICT[p.verdict] || ["warn", ""];
    const head = p.comparable
      ? `<div class="verdict"><span class="chip ${v[0]}">${esc(String(p.verdict).replace(/_/g, " "))}</span>
           <div style="margin-top:8px">${esc(v[1])}</div>
           <div style="margin-top:8px;color:var(--dim);font-size:12.5px">
             ${esc(cmp.drop_week_label || "W+" + cmp.drop_week_index)} holds
             <strong style="font-family:var(--mono)">${esc(pct(p.this_share_of_w0))}</strong> of its own W0.
             The ${esc(p.n)} prior drop${p.n === 1 ? "" : "s"} at this point held a median of
             <strong style="font-family:var(--mono)">${esc(pct(p.median_share_of_w0))}</strong>
             (range ${esc(pct(p.min_share_of_w0))} – ${esc(pct(p.max_share_of_w0))}).
           </div></div>`
      : `<div class="banner warn" style="margin:0">No verdict for this week. ${esc(p.not_comparable_reason)}</div>${coverage(cmp)}`;

    // P1.4. A like-for-like warning outranks the verdict: comparing a
    // discount-assisted week against undiscounted peers, or the reverse, blames
    // the drop for the promotion.
    const mismatch = p.campaign_mismatch === true
      ? `<div class="banner bad" style="margin:12px 0 0"><strong>Not like-for-like.</strong> ${esc(p.campaign_mismatch_note)}</div>`
      : "";

    return `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        <h3 style="margin:0">Drop-relative comparison</h3>
        <div class="toggle" id="decaytoggle">
          <button data-m="share" aria-pressed="${decayMode === "share"}">Decay shape</button>
          <button data-m="orders" aria-pressed="${decayMode === "orders"}">Absolute orders</button>
        </div>
      </div>
      ${head}
      ${mismatch}
      <div style="margin-top:14px">${decayChart(cmp)}</div>
      <div class="sub" style="margin-top:10px">
        ${decayMode === "share"
          ? "Each drop plotted as a share of its own W0. W0 orders fell 34% across the season, so absolute levels measure how big a drop was, not how fast it decayed — the verdict is read off this view only."
          : "Absolute orders, shown for scale. Not used to judge decay: W0 size varies by drop."}
        ${esc(cmp.discount_window_note || "")}
      </div>
    </div>`;
  }

  // The page's opening sentence. Not a metric — a claim, derived only from this
  // week's own numbers, that says what happened and what it costs. Everything
  // below it is the evidence for it.
  function lede(s) {
    const cmp = s.drop_comparison || {};
    const cur = (cmp.cohorts || []).find((c) => c.is_current);
    const idx = Number(cmp.drop_week_index);
    const pts = cur ? cur.points.filter((p) => !isBlank(p.orders)).sort((a, b) => a.i - b.i) : [];
    const here = pts.find((p) => p.i === idx);
    const prev = pts.find((p) => p.i === idx - 1);

    const lines = [];
    let head = "";
    let tone = "";

    if (cur && here && !isBlank(cur.w0_orders)) {
      const share = Number(here.orders) / Number(cur.w0_orders);
      const dir = prev ? Number(here.orders) - Number(prev.orders) : null;
      head = `${esc(cmp.drop_week_label || "W+" + idx)} of the ${esc(cmp.drop_id)} drop — ${esc(num0(here.orders))} orders, ${esc((share * 100).toFixed(0))}% of this drop's opening week.`;
      // Never call a move unexplained without first checking what moved it.
      const ch = s.change_attribution || {};
      if (dir !== null && dir !== 0) {
        const bought = ch.verdict === "bought" || ch.verdict === "spend_cut" || ch.verdict === "bought_at_worse_rate";
        tone = dir > 0 ? (bought ? "" : "good") : (share >= 0.6 ? "warn" : "bad");
        lines.push(`Orders <strong>${dir > 0 ? "rose" : "fell"}</strong> ${esc(num0(Math.abs(dir)))} on last week. ${esc(ch.sentence || "")}`);
        if (ch.aov_note) lines.push(esc(ch.aov_note));
      }
    } else {
      head = "This week is not mapped to a drop, so there is no position to read it against.";
      tone = "warn";
    }

    // The money line. Only figures that survived their own basis checks.
    const K = s.leakage || {}, L = s.leadership || {};
    const cost = [];
    if (K.wasted_ad_spend && !isBlank(K.wasted_ad_spend.value) && L.mer && !isBlank(L.mer.value) && L.net_sales_attributed && !isBlank(L.net_sales_attributed.value)) {
      const spend = Number(L.net_sales_attributed.value) / Number(L.mer.value);
      cost.push(`<strong>${esc(money(K.wasted_ad_spend.value))}</strong> of ad spend went to orders that came back — ${esc(((Number(K.wasted_ad_spend.value) / spend) * 100).toFixed(0))}% of the week's spend.`);
    }
    if (K.not_delivered_rate && !isBlank(K.not_delivered_rate.value)) {
      cost.push(`${esc(pct(K.not_delivered_rate.value))} of resolved parcels came back${K.not_delivered_rate.settled === false ? ", and this week is not settled" : ""}.`);
    }
    if (cost.length) lines.push(cost.join(" "));

    if (trustBad(s)) {
      lines.push(`The engine's funnel conclusion for this week is <strong>not trustworthy</strong> — see Diagnosis.`);
      tone = tone || "warn";
    }

    return `<div class="lede ${tone}"><h2>${head}</h2>${lines.map((l) => `<p>${l}</p>`).join("")}</div>`;
  }

  function trustBad(s) {
    return !!(s.diagnosis && s.diagnosis.trust && s.diagnosis.trust.trusted === false);
  }

  // Where the drop-relative comparison actually has peers. Without this an empty
  // card looks broken; with it the reader sees that W+1 and W+2 are well covered
  // and the later indices structurally never will be.
  function coverage(cmp) {
    const counts = cmp.peers_by_index || {};
    const here = Number(cmp.drop_week_index);
    const max = Math.max(here, ...Object.keys(counts).map(Number));
    if (!Number.isFinite(max) || max < 1) return "";
    const parts = [];
    for (let i = 1; i <= max; i++) {
      const n = counts[i] || 0;
      parts.push(`<span style="color:${i === here ? "var(--accent)" : n >= 2 ? "var(--dim)" : "var(--faint)"}">W+${i}: ${n}</span>`);
    }
    return `<div class="sub" style="margin-top:10px">Earlier drops with a complete week at each position — ${parts.join(" · ")}.
      Two is the minimum for a verdict, so this comparison only works at the positions above that.</div>`;
  }

  // What moved the number. Deliberately not styled as a verdict — no good/bad
  // colour — because whether the level is right is the drop-relative question.
  function changeCard(ch) {
    if (!ch || !ch.available) return "";
    const row = (n, m, fmt) => m && m.pct !== "" && !isBlank(m.now)
      ? `<div class="rung"><span class="name">${esc(n)}</span><span class="v">${esc(fmt(m.now))}
         <span style="color:${Number(m.pct) >= 0 ? "var(--good)" : "var(--bad)"};font-size:12px">${Number(m.pct) >= 0 ? "+" : ""}${esc((Number(m.pct) * 100).toFixed(0))}%</span></span></div>`
      : "";
    return `<div class="card" style="margin-top:12px">
      <h3>What moved it — vs ${esc(ch.prior_week)}</h3>
      <p style="margin:0 0 10px;font-size:13px">${esc(ch.sentence)} ${esc(ch.aov_note || "")}</p>
      ${row("Orders", ch.orders, num0)}
      ${row("Meta spend", ch.spend, money)}
      ${row("Cost per order", ch.cost_per_order, money2)}
      ${row("AOV", ch.aov, money2)}
      <div class="sub" style="margin-top:10px">${esc(ch.scope)}</div>
    </div>`;
  }

  // ---- Daily ops -----------------------------------------------------------
  async function renderDaily() {
    const { surface: s } = await get("/surface/daily");
    $("ctx").textContent = s.timezone + " · latest " + (s.latest_week || "—");

    // The banner keys off the reconciled verdict, never off a raw error count.
    // An endpoint's last row can be an error from a week ago while its data has
    // been arriving fine ever since; calling that "failing" is the false alarm
    // this page exists to abolish.
    const al = s.sync_alert || { verdict: "healthy", failing: 0, stale_errors: 0, note: "" };
    const onFire = (s.sync_health || []).filter((r) => r.alert === "failing");
    const stale = (s.sync_health || []).filter((r) => r.alert === "stale_error");
    const banner = al.verdict === "on_fire"
      ? `<div class="banner bad"><strong>${esc(al.failing)} source${al.failing > 1 ? "s" : ""} down — no data for the latest week.</strong><br>
         ${onFire.map((f) => esc(f.endpoint) + " — " + esc(f.error || "error")).join("<br>")}</div>`
      : al.verdict === "healthy_with_stale_errors"
      ? `<div class="banner warn"><strong>Nothing is on fire.</strong> ${esc(al.note)}<br>
         <span style="color:var(--faint)">Last failures on record: ${stale.map((f) => esc(f.endpoint) + " (" + esc(String(f.finished_at).slice(0, 10)) + ")").join(", ")}</span></div>`
      : `<div class="banner"><strong>All syncs healthy.</strong> Every source has data for ${esc(s.latest_week)}.</div>`;

    const d = s.delivery || {};
    const r = s.restock_summary || { skus: 0, out_of_stock: 0, weekly_net_sales: 0, cover_days_threshold: 14 };
    const ordersDelta = (!isBlank(s.orders_latest_week) && !isBlank(s.orders_prior_4w_avg) && Number(s.orders_prior_4w_avg))
      ? ((Number(s.orders_latest_week) / Number(s.orders_prior_4w_avg) - 1) * 100).toFixed(0) + "%"
      : "—";

    main.innerHTML = `
      <p class="q">${esc(s.question)} — daily, under five minutes.</p>
      ${banner}
      <div class="grid g5">
        <div class="card kpi"><div class="label">Orders, latest week</div>
          <div class="val">${esc(num0(s.orders_latest_week) ?? "no data")}</div>
          <div class="note">vs prior 4-week average ${esc(num0(s.orders_prior_4w_avg) ?? "—")} (${esc(ordersDelta)}).
          ${Number(s.orders_latest_week) >= Number(s.orders_prior_4w_avg)
            ? "Up on the trailing average. Whether that is good depends on where this sits after the drop — see the weekly review."
            : "A post-drop week is expected to be down; judge decay on the weekly review, not here."}</div></div>
        ${kpi("Not delivered (RTO)", d.not_delivered_rate, pct)}
        <div class="card kpi"><div class="label">Carrier reporting</div>
          <div class="val">${esc(pct(d.carrier_reporting_rate) ?? "no data")}</div>
          <div class="note">Delivery metrics are only as good as this.</div></div>
        <div class="card kpi"><div class="label">Parcels in transit</div>
          <div class="val">${esc(num0(d.pending_orders) ?? "no data")}</div>
          <div class="note">Outcome not yet known.</div></div>
      </div>

      <div class="grid g2" style="margin-top:12px;align-items:start">
        <div class="card"><h3>Sync health</h3>
          ${(s.sync_health || []).length ? `<table><thead><tr><th>Source</th><th>State</th><th>Latest week</th><th>Last finished</th></tr></thead><tbody>
          ${s.sync_health.map((r) => {
            const cls = r.alert === "ok" ? "good" : r.alert === "failing" ? "bad" : "warn";
            const label = r.alert === "ok" ? "ok" : r.alert === "failing" ? "down" : r.alert === "stale_error" ? "stale error" : "unresolved";
            return `<tr><td>${esc(r.endpoint)}</td>
            <td><span class="chip ${cls}">${esc(label)}</span></td>
            <td>${r.data_present_for_latest_week === null ? "<span style=\"color:var(--faint)\">n/a</span>" : (r.data_present_for_latest_week ? "data in" : "<span style=\"color:var(--bad)\">missing</span>")}</td>
            <td>${esc(String(r.finished_at || "").replace("T", " ").slice(0, 16))}</td></tr>`;
          }).join("")}
          </tbody></table>` : `<div class="empty">No sync history.</div>`}
        </div>
        <div class="card"><h3>Restock now — ${esc(r.skus)} SKUs, ${esc(moneyE(r.weekly_net_sales))} of weekly sales</h3>
          <div class="sub" style="margin-bottom:8px">${esc(r.out_of_stock)} already out of stock; the rest under ${esc(r.cover_days_threshold)} days of cover.
          The figure is what these SKUs sold this week — it stops if they stay unavailable.</div>
          ${(s.restock || []).length ? `<table><thead><tr><th>Product</th><th>Size</th><th class="n">Sold</th><th class="n">Sales</th><th class="n">Cover</th></tr></thead><tbody>
          ${s.restock.map((x) => `<tr>
            <td>${esc(x.product_title)}</td>
            <td style="color:var(--dim)">${esc(x.variant_title || "—")}</td>
            <td class="n">${esc(x.units_sold)}</td>
            <td class="n">${esc(money(x.net_sales) ?? "—")}</td>
            <td class="n">${x.out_of_stock ? `<span class="chip bad">out</span>` : (isBlank(x.days_of_cover) ? "—" : esc(Number(x.days_of_cover).toFixed(1)))}</td>
          </tr>`).join("")}
          </tbody></table>` : `<div class="empty">Nothing is out of stock or under ${esc(r.cover_days_threshold)} days of cover.</div>`}
        </div>
      </div>
      <p class="foot">Alerts and current state only. No historical analysis — that is the weekly review.</p>`;
  }

  // ---- Weekly review -------------------------------------------------------
  // `week === undefined` re-renders the payload already in hand (a chart toggle),
  // so flipping the decay view costs no readAllTabs.
  async function renderWeekly(week) {
    const res = (week === undefined && lastWeekly) ? lastWeekly : await get("/surface/weekly", { week_start: week });
    lastWeekly = res;
    const s = res.surface, h = s.header, L = s.leadership, D = s.drivers, K = s.leakage;
    const trust = s.diagnosis && s.diagnosis.trust;
    $("ctx").textContent = h.week_start + " → " + h.week_end;

    const opts = (res.available_weeks || []).map((w) =>
      `<option value="${esc(w)}" ${w === h.week_start ? "selected" : ""}>${esc(w)}</option>`).join("");

    const chips = [
      h.drop_label ? `<span class="chip drop">${esc(h.drop_label)} of ${esc(h.drop_id || "drop")}</span>` : "",
      `<span class="chip ${h.attribution_settled ? "good" : "warn"}">attribution ${h.attribution_settled ? "settled" : "age " + esc(h.attribution_age_days) + "d"}</span>`,
      `<span class="chip ${h.delivery_settled ? "good" : "warn"}">delivery ${h.delivery_settled ? "settled" : "in flight"}</span>`,
      h.freshness && h.freshness !== "fresh" ? `<span class="chip warn">${esc(h.freshness)}${(h.stale_sources || []).length ? " vs " + esc(h.stale_sources.join(", ")) : ""}</span>` : ""
    ].filter(Boolean).join("");

    main.innerHTML = `
      <p class="q">${esc(s.question)} — weekly.</p>
      <div class="wk"><select id="wsel">${opts}</select>${chips}</div>
      ${lede(s)}
      ${h.provisional_note ? `<div class="banner warn">${esc(h.provisional_note)}</div>` : ""}

      <div class="grid gl">
        ${kpi("Contribution margin", L.contribution_margin, moneyE)}
        ${kpi("Net sales (attributed)", L.net_sales_attributed, moneyE)}
        ${kpi("Net sales (as booked)", L.net_sales, moneyE)}
        ${kpi("Delivered CAC", L.delivered_cac, money2E)}
        ${kpi("Orders", L.orders, num0)}
        ${kpi("MER", L.mer, (v) => Number(v).toFixed(2))}
      </div>

      ${contributionCard(s.contribution)}
      <div style="margin-top:12px">${dropComparisonCard(s.drop_comparison)}</div>
      ${changeCard(s.change_attribution)}

      <div class="grid g2" style="margin-top:12px;align-items:start">
        <div class="card"><h3>Driver tree — attention to money</h3>
          ${funnel("Paid path (Meta)", [
            { n: "Impressions", v: D.impressions },
            { n: "Link clicks", v: D.link_clicks },
            { n: "Landing page views", v: D.landing_page_views }
          ], "Clicks that never became a landing-page view are spend lost before the site was seen.")}
          ${rung("CTR (link)", D.ctr_link, pct)}
          ${rung("CPC (link)", D.cpc_link, money2)}
          ${rung("LPV rate from click", D.lpv_rate_from_link_click, pct)}
          ${rung("Sessions (GA4, all sources)", D.sessions, num0)}
          ${rung("Add-to-cart rate", D.add_to_cart_rate, pct)}
          ${rung("Checkout completion", D.checkout_completion_rate, pct)}
          ${rung("Click → order", D.click_to_order, pct)}
          ${rung("AOV", D.aov, money2)}
          <div class="sub" style="margin-top:10px">Sessions are not drawn as a funnel step below landing-page views:
          GA4 counts organic traffic Meta never sent, so the two are different populations. For the same reason
          click → order is a ratio, not a conversion rate.</div>
        </div>
        <div class="card"><h3>Where the money goes (EGP)</h3>
          ${rung("Discounts", K.discounts, money)}
          ${rung("Discount rate", K.discount_rate, pct)}
          <div style="margin-top:10px">
            ${kpiInline("Reversals (booked)", K.sales_reversals, money)}
            ${kpiInline("Not delivered", K.not_delivered_rate, pct)}
            ${kpiInline("Wasted ad spend", K.wasted_ad_spend, money)}
            ${kpiInline("RTO freight — the real loss", K.rto_freight, moneyE)}
            ${kpiInline("Freight, both legs", K.freight_total, moneyE)}
            ${kpiInline("RTO goods cycled", K.rto_goods_cycled, money)}
          </div>
        </div>
      </div>

      ${(s.rto_by_sku || []).length ? `<div class="card" style="margin-top:12px">
        <h3>Which products come back</h3>
        <div class="sub" style="margin-bottom:8px">Courier-measured, same basis as the weekly rate. Ranked by the money that came back, not by rate —
        a high rate on a cheap tee costs less than a modest one on a jacket. SKUs under 10 resolved units are excluded: a rate on a tiny denominator is noise.</div>
        <table><thead><tr><th>Product</th><th>Size</th><th class="n">Shipped</th><th class="n">Back</th><th class="n">Rate</th><th class="n">Value back</th></tr></thead><tbody>
        ${s.rto_by_sku.map((r) => `<tr>
          <td>${esc(r.product_title)}</td>
          <td style="color:var(--dim)">${esc(r.variant_title || "—")}</td>
          <td class="n">${esc(num0(r.units_shipped))}</td>
          <td class="n">${esc(num0(r.units_not_delivered))}</td>
          <td class="n"><span class="chip ${Number(r.rto_rate_units) >= 0.3 ? "bad" : Number(r.rto_rate_units) >= 0.2 ? "warn" : ""}">${esc(pct(r.rto_rate_units))}</span></td>
          <td class="n">${esc(money(r.revenue_not_delivered) ?? "—")}</td>
        </tr>`).join("")}
        </tbody></table>
      </div>` : ""}

      <div class="card" style="margin-top:12px"><h3>Diagnosis</h3>
        ${s.diagnosis.post_drop_decay_suppressed
          ? `<div class="banner warn" style="margin-bottom:10px">Post-drop decay suppressed: CTR fell while click-to-order held, so this decline is attention, not conversion.</div>` : ""}
        ${trust && trust.trusted === false
          ? `<div class="banner bad" style="margin-bottom:10px"><strong>Do not act on the funnel conclusion below.</strong><br>${esc(trust.reason)}</div>` : ""}
        ${["main_problem","funnel_problem","meta_problem","final"].map((k) => {
          if (!s.diagnosis[k]) return "";
          // A conclusion drawn from a threshold the store has never met is shown
          // struck through rather than deleted: hiding it would leave the reader
          // wondering what the engine actually said.
          const doubt = trust && trust.trusted === false && (k === "funnel_problem" || k === "final");
          // Label above, sentence below. Right-aligning a full sentence against a
          // left-aligned label produced a ragged column that was hard to scan.
          return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin-bottom:3px">${esc(k.replace(/_/g," "))}</div>
            <div class="${doubt ? "untrusted" : ""}" style="font-size:13px">${esc(s.diagnosis[k])}</div>
          </div>`;
        }).join("") || `<div class="empty">No diagnosis recorded.</div>`}
        ${trust && trust.trusted !== null && trust.weeks
          ? `<div class="sub" style="margin-top:10px">Add-to-cart this week ${esc(pct(trust.week_rate))} · store median over ${esc(trust.weeks)} weeks ${esc(pct(trust.observed_median))} · hardcoded goal ${esc(pct(trust.threshold))}.</div>` : ""}
      </div>
      <p class="foot">Every figure carries its basis and settledness. A provisional week is understated on delivery and
      overstated on attributed net sales — compare only against weeks at the same attribution age. There is deliberately
      no week-over-week delta on this page: revenue is drop-driven, so calendar comparison raises a false alarm every
      post-drop week. The drop-relative view above is the comparison that means something.</p>`;

    $("wsel").addEventListener("change", (e) => renderWeekly(e.target.value));
    const tog = $("decaytoggle");
    if (tog) tog.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      decayMode = b.dataset.m;
      renderWeekly(undefined);
    });
  }

      <p class="foot" id="adminfoot">Goals, ad↔product mapping and the funds monitor are not yet on the surface API —
      <a class="link" href="/report">the existing page</a> still has them.</p>`;
  
    $("perfgo").addEventListener("click", async () => {
      const box = $("perfbox");
      box.innerHTML = `<div class="sub">Reading orders and ad spend…</div>`;
      try {
        const { surface: P } = await get("/surface/ad-performance-live", { days: $("perfdays").value });
        box.innerHTML = adPerformanceCard(P);
      } catch (err) {
        box.innerHTML = `<div class="banner bad" style="margin:10px 0 0">Could not run. ${esc(err.message)}</div>`;
      }
    });

    $("livego").addEventListener("click", async () => {
      const box = $("livebox");
      box.innerHTML = `<div class="sub" style="margin-top:10px">Reading recent orders…</div>`;
      try {
        const { surface: L } = await get("/surface/attribution-live");
        box.innerHTML = liveAttributionCard(L);
      } catch (err) {
        box.innerHTML = `<div class="banner bad" style="margin:10px 0 0">Could not read orders. ${esc(err.message)}</div>`;
      }
    });
  }

  // Every number here is a BOUND, not a measurement, and the card says so before
  // it shows a single figure. Spend is complete and orders are undercounted, so
  // cost-per-order can only read high.
  function adPerformanceCard(P) {
    const c = P.coverage;
    const thin = !isBlank(c.join_rate) && Number(c.join_rate) < 0.5;
    return `<div style="margin-top:10px">
      ${thin ? `<div class="banner warn"><strong>Only ${esc(pct(c.join_rate))} of orders in this window can be joined to an ad.</strong>
        Per-ad order counts are therefore a floor and cost-per-order a ceiling. Read the ranking, not the absolute values —
        and an ad showing no orders has not been shown to sell nothing.</div>` : ""}
      <div class="grid g5">
        <div class="card kpi"><div class="label">Spend in window</div><div class="val">${esc(moneyE(P.spend_total) ?? "—")}</div>
          <div class="note">${esc(P.window.since)} → ${esc(P.window.until)}, ${esc(P.window.timezone)}.</div></div>
        <div class="card kpi"><div class="label">Orders joined to an ad</div><div class="val">${esc(num0(c.orders_joined_to_an_ad))}</div>
          <div class="note">of ${esc(num0(c.orders_in_window))} in the window.</div></div>
        <div class="card kpi"><div class="label">Spend with no joined order</div><div class="val">${esc(moneyE(P.unjoined_spend.spend) ?? "—")}</div>
          <div class="note">${esc(P.unjoined_spend.ads)} ads. ${esc(P.unjoined_spend.note)}</div></div>
      </div>
      <table style="margin-top:12px"><thead><tr>
        <th>Ad</th><th class="n">Spend</th><th class="n">Orders</th>
        <th class="n">Max EGP/order</th><th class="n">Min ROAS</th>
      </tr></thead><tbody>
      ${(P.ads || []).slice(0, 20).map((a) => `<tr>
        <td>${esc(a.ad_name || a.ad_id)}<br><span style="color:var(--faint);font-size:11px">${esc(a.campaign_name)}</span></td>
        <td class="n">${esc(money(a.spend))}</td>
        <td class="n">${esc(a.attributed_orders)}</td>
        <td class="n">${isBlank(a.max_cost_per_attributed_order) ? "—" : esc(money(a.max_cost_per_attributed_order))}</td>
        <td class="n">${isBlank(a.min_attributed_roas) ? "—" : esc(a.min_attributed_roas)}</td>
      </tr>`).join("")}
      </tbody></table>
      <div class="sub" style="margin-top:10px">${(P.caveats || []).map(esc).join(" ")}</div>
    </div>`;
  }

  const LIVE_VERDICT = {
    not_capturing: ["bad", "No recent order carries capture attributes. The snippet is not firing."],
    capturing_but_no_ad_join: ["warn", "Capture works, but no order joins to a specific ad. Every ad-level number stays impossible."],
    partially_joined: ["warn", "Capture works and some orders join to an ad. The rest are listed below with what blocked them."],
    fully_joined: ["good", "Every captured order joins to a specific ad."],
    no_orders: ["warn", "No orders returned."]
  };

  function liveAttributionCard(L) {
    const v = LIVE_VERDICT[L.verdict] || ["warn", ""];
    return `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
      <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">
        <span class="chip ${v[0]}">${esc(String(L.verdict).replace(/_/g, " "))}</span>
        <span style="font-size:13px">${esc(v[1])}</span>
      </div>
      <div class="sub" style="margin-top:6px">${esc(L.scope)}</div>
      <div class="grid g5" style="margin-top:10px">
        <div class="card kpi"><div class="label">Captured</div><div class="val">${esc(pct(L.captured_rate) ?? "—")}</div>
          <div class="note">${esc(L.captured)} of ${esc(L.orders_checked)} orders carry attributes.</div></div>
        <div class="card kpi"><div class="label">Join to a specific ad</div><div class="val">${esc(pct(L.ad_joinable_rate) ?? "—")}</div>
          <div class="note">${esc(L.ad_joinable)} of ${esc(L.orders_checked)}. This is what per-ad CAC needs.</div></div>
      </div>
      ${(L.blocking_ad_join || []).length ? `<div class="sub" style="margin-top:12px">These arrived in <code>utm_content</code> but are not ad ids — each is an ad whose own URL parameters override the account default, or an organic link:</div>
      <table style="margin-top:6px"><thead><tr><th>utm_content value</th><th class="n">Orders</th></tr></thead><tbody>
      ${L.blocking_ad_join.map((b) => `<tr><td style="font-family:var(--mono);font-size:12px">${esc(b.value)}</td><td class="n">${esc(b.orders_affected)}</td></tr>`).join("")}
      </tbody></table>` : ""}
      <details style="margin-top:12px"><summary class="sub" style="cursor:pointer">Recent orders</summary>
      <table style="margin-top:6px"><thead><tr><th>Order</th><th>When</th><th>Platform</th><th>utm_content</th><th>Tier</th></tr></thead><tbody>
      ${(L.recent || []).map((r) => `<tr><td>${esc(r.order)}</td>
        <td>${esc(String(r.created_at).replace("T", " ").slice(5, 16))}</td>
        <td>${esc(r.platform || "—")}</td>
        <td style="font-family:var(--mono);font-size:11.5px">${esc(r.content || "—")}</td>
        <td><span class="chip ${r.ad_id ? "good" : r.confidence === "unattributed" ? "bad" : "warn"}">${esc(r.confidence.replace(/_/g, " "))}</span></td></tr>`).join("")}
      </tbody></table></details>
    </div>`;
  }


  function renderStub(title, body, href) {
    $("ctx").textContent = "";
    main.innerHTML = `<p class="q">${esc(title)}</p><div class="card"><p style="margin:0 0 10px">${esc(body)}</p>
      ${href ? `<a class="link" href="${esc(href)}">Open the existing page →</a>` : ""}</div>`;
  }

  async function render() {
    main.innerHTML = `<div class="empty">Loading…</div>`;
    try {
      if (surface === "daily") return await renderDaily();
      if (surface === "weekly") return await renderWeekly("");
      return await renderAdmin();
    } catch (err) {
      main.innerHTML = `<div class="banner bad"><strong>Could not load.</strong> ${esc(err.message)}<br>
        <span style="color:var(--faint)">If this says 401 or 403, reload to renew Cloudflare Access.</span></div>`;
    }
  }

  // "ai" is deliberately absent: the generated narrative was removed from the
  // dashboard on 2026-09-09 because more surfaces means more to decide between,
  // and the three that remain are the ones that answer a question. The endpoint
  // and the pack still exist and /report still renders them.
  const SURFACES = ["daily", "weekly", "admin"];

  function selectFromHash() {
    const want = String(location.hash || "").replace(/^#/, "");
    surface = SURFACES.includes(want) ? want : "daily";
    document.querySelectorAll("nav button").forEach((x) =>
      x.setAttribute("aria-selected", String(x.dataset.s === surface)));
  }

  document.querySelectorAll("nav button").forEach((b) => {
    b.addEventListener("click", () => {
      lastWeekly = null;
      // Route through the hash so every surface is linkable, bookmarkable, and
      // reachable by anything that can only open a URL.
      if (location.hash === "#" + b.dataset.s) { selectFromHash(); render(); }
      else location.hash = b.dataset.s;
    });
  });

  window.addEventListener("hashchange", () => { lastWeekly = null; selectFromHash(); render(); });

  selectFromHash();
  render();
})();
</script>
</body>
</html>
